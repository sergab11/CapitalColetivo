{% extends 'usuarios/base.html' %}

{% block title %}Nova Campanha{% endblock %}

{% block conteudo %}
<div class="w-1/2 my-6 mx-auto px-6 bg-purple-200 rounded-xl">
    <div class="max-w-3xl mx-auto py-10">
        <h1 class="text-2xl text-center font-bold text-purple-700 mb-6">Nova Campanha</h1>
        <form method="post" action="{% url 'campanhas:form_criacao_camp' projeto.id %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="id_titulo" class="block text-purple-700"><strong>Título</strong></label>
                {{ form.titulo }}
            </div>
            <div>
                <label for="id_tipo_crowdfunding" class="block text-purple-700"><strong>Tipo de Crowdfunding:</strong></label>
                {{ form.tipo_crowdfunding }}
            </div>
            <div>
                <label for="id_data_inicio" class="block text-purple-700"><strong>Data Início:</strong></label>
                {{ form.data_inicio }}
            </div>
            <div>
                <label for="id_data_fim" class="block text-purple-700"><strong>Data Fim:</strong></label>
                {{ form.data_fim }}
            </div>
            <div>
                <label for="id_meta" class="block text-purple-700"><strong>Meta (R$):</strong></label>
                {{ form.meta }}
            </div>
            <div>
                <label for="id_descricao" class="block text-purple-700"><strong>Descrição:</strong></label>
                {{ form.descricao }}
            </div>
            <div>
                <label for="id_modo" class="block text-purple-700"><strong>Modo:</strong></label>
                {{ form.modo }}
            </div>
            <div class="flex justify-between">
                <button type="submit" class="bg-purple-800 text-white px-4 py-2 rounded">Salvar</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
