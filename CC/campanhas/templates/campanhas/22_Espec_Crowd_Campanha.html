{% extends 'usuarios/base.html' %}

{% block titulo %}Dados do Tipo de Crowdfunding{% endblock %}

{% block conteudo %}
<div class="w-1/2 my-6 mx-auto px-6 bg-gray-100 rounded-xl">
    <h1 class="text-2xl font-bold text-purple-700 mb-6">Crowdfunding de {{ tipo }}</h1>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}" class="block text-purple-700"><strong>{{ field.label }}:</strong></label>
                    <label class="border-purple-500 rounded-lg py-2 px-4 block w-full focus:outline-none focus:ring-2 focus:ring-purple-600">{{ field }}</label>
                    {{ field.errors }}
                </div>
            {% endfor %}
            <div class="flex justify-between">
                <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded">Continuar</button>
            </div>
        </form>
</div>

{% endblock %}
